# Downloads the recruitment service's announcements once a day.
#
# Why here rather than on a server: the feed sends no CORS headers, so the
# browser cannot read it itself, and a Cloud Function would mean upgrading to a
# paid plan for something that runs 365 times a year. A GitHub Action on a
# public repo does it free, and the result is a static file — no infrastructure
# that can fall over.
#
# The commit does not deploy anything by itself. The app reads the file
# directly from raw.githubusercontent.com, which sends
# `access-control-allow-origin: *`, so a new announcement reaches users with no
# build needed.
name: Ανακοινώσεις στρατολογίας

on:
  schedule:
    # 05:00 UTC — early morning Greek time, before the day's use.
    - cron: '0 5 * * *'
  workflow_dispatch:

# The only permission needed: writing the file back to the repository.
permissions:
  contents: write

concurrency:
  group: announcements
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The parser against a saved feed first: if it has broken, there is no
      # point writing rubbish into the repository.
      - name: Έλεγχος parser
        run: node scripts/fetch-announcements.mjs --selftest

      # No dependencies: the script uses nothing but Node's own fetch.
      - name: Ανάκτηση feed
        run: node scripts/fetch-announcements.mjs

      - name: Commit αν άλλαξε κάτι
        run: |
          if git diff --quiet -- public/announcements.json; then
            echo "Καμία αλλαγή στις ανακοινώσεις."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/announcements.json
          git commit -m "Update announcements from stratologia.gr"
          git push
