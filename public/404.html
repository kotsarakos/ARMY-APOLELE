<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06070A" />
    <meta name="robots" content="noindex" />
    <title>404 — Army Apolele</title>

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;

        padding: 24px; text-align: center;
        background: #06070A; color: #F4F5F3;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .code {
        font-family: 'Arial Narrow', Impact, sans-serif;
        font-size: clamp(72px, 22vw, 128px); font-weight: 700;
        line-height: 0.86; letter-spacing: -2px; margin: 0; color: #D9A441;
      }
      h1 { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
      p { margin: 0 0 8px; color: #84887E; font-size: 15px; line-height: 1.55; max-width: 40ch; }
      .en { color: #585B54; font-size: 13px; }
      a {
        display: inline-block; margin-top: 24px; padding: 12px 20px;
        background: #7C8B3F; color: #0A0B0D; text-decoration: none;
        border-radius: 10px; font-size: 14px; font-weight: 500; min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Η σελίδα δεν βρέθηκε</h1>
      <p>Η διεύθυνση που ζήτησες δεν υπάρχει. Μάλλον πήρες λάθος στροφή.</p>
