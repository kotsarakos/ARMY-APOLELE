<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable lock pinch-zoom, as requested. So that
         zooming is never needed: text starts at 15px, fields are 16px (below
         that iOS Safari zooms in on focus) and touch targets are at least
         44px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06070A" />
    <meta name="color-scheme" content="dark" />

    <title>Army Apolele — Μέτρηση Στρατιωτικής Θητείας</title>
    <meta name="description" content="Μέτρησε τις μέρες μέχρι το απολυτήριο. Υπολογισμός θητείας, αδειών και οροσήμων με βάση το ισχύον πλαίσιο (Ν. 5265/2026). Δωρεάν, χωρίς λογαριασμό, χωρίς παρακολούθηση." />
    <meta name="keywords" content="στρατός, θητεία, απολυτήριο, φαντάρος, ΕΣΣΟ, άδειες, Greek army, military service, countdown" />
    <meta name="author" content="Konstantinos Kotsaras" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://army-apolele.web.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://army-apolele.web.app/" />
    <meta property="og:site_name" content="Army Apolele" />
    <meta property="og:title" content="Army Apolele — Μέτρηση Στρατιωτικής Θητείας" />
    <meta property="og:description" content="Μέτρησε τις μέρες μέχρι το απολυτήριο. Θητεία, άδειες και ορόσημα με βάση το ισχύον πλαίσιο." />
    <meta property="og:locale" content="el_GR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="/icon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Army Apolele — Μέτρηση Στρατιωτικής Θητείας" />
    <meta name="twitter:description" content="Μέτρησε τις μέρες μέχρι το απολυτήριο." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Apolele" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Roboto Condensed/Mono: they cover Greek AND Latin. Oswald and IBM Plex
         Mono have no Greek glyphs and fell back silently. Both are served from
         this origin now — see src/styles/fonts.css for why, and for the fact
         that they are variable fonts, one file per subset for every weight.

         There is deliberately no <link rel="preload"> for them. It was tried
         and measured: preloading the two most visible faces put 55 kB in front
         of the JavaScript that has to render the page at all, and pushed the
         median first paint from 1504 ms to 1773 ms on a throttled 4G link.
         font-display: swap means text is never invisible while they load. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Χρειάζεται JavaScript για τη λειτουργία της εφαρμογής.
      &nbsp;·&nbsp; This app requires JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
